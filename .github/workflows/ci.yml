name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Formatage (gofmt)
        run: |
          non_formates=$(gofmt -l .)
          if [ -n "$non_formates" ]; then
            echo "Fichiers Go non formatés, lancer « gofmt -w » :"
            echo "$non_formates"
            exit 1
          fi
      - run: go test -race ./...
